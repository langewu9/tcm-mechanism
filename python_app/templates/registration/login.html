{% load static %}
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>登录 · 岐黄研究平台</title>
    <link rel="stylesheet" href="{% static 'core/platform.css' %}">
  </head>
  <body>
    <main class="login-shell">
      <a class="brand" href="/">岐黄 <span>研究平台</span></a>
      <section class="login-card">
        <p class="eyebrow">RESEARCHER ACCESS</p>
        <h1>登录研究平台</h1>
        {% if form.errors %}<p class="form-error">用户名或密码不正确，请重试。</p>{% endif %}
        <form method="post">
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          <label for="id_username">用户名</label>
          <input id="id_username" name="username" autocomplete="username" required autofocus>
          <label for="id_password">密码</label>
          <input id="id_password" name="password" type="password" autocomplete="current-password" required>
          <button class="primary full-width" type="submit">登录</button>
        </form>
      </section>
    </main>
  </body>
</html>
