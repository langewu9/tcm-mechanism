x-python-build: &python-build
  context: ..
  dockerfile: deploy/python/Dockerfile.production

x-django-environment: &django-environment
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env.production}
  DJANGO_ALLOWED_HOSTS: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env.production}
  CSRF_TRUSTED_ORIGINS: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env.production}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL in .env.production}
  EMAIL_HOST: ${EMAIL_HOST:?Set EMAIL_HOST in .env.production}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:?Set EMAIL_HOST_USER in .env.production}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:?Set EMAIL_HOST_PASSWORD in .env.production}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:?Set DEFAULT_FROM_EMAIL in .env.production}
  ADMIN_NOTIFICATION_EMAILS: ${ADMIN_NOTIFICATION_EMAILS:-}
  EMAIL_VERIFICATION_MAX_AGE_SECONDS: ${EMAIL_VERIFICATION_MAX_AGE_SECONDS:-86400}
  DJANGO_SECURE_SSL_REDIRECT: "true"
  DJANGO_SESSION_COOKIE_SECURE: "true"
  DJANGO_CSRF_COOKIE_SECURE: "true"
  DJANGO_USE_X_FORWARDED_PROTO: "true"
  DJANGO_SECURE_HSTS_SECONDS: "31536000"
  DATABASE_URL: postgres://tcm_platform:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/tcm_platform
  CASE_RAG_DATABASE_URL: ${CASE_RAG_DATABASE_URL:-sqlite:////app/var/case-rag/corpus.sqlite3}
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}@redis:6379/0
  CACHE_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}@redis:6379/1
  RUNTIME_LOG_DIR: /app/var/runtime-logs
  DJANGO_LOGIN_IP_RATE: ${DJANGO_LOGIN_IP_RATE:-30/min}
  DJANGO_LOGIN_ACCOUNT_RATE: ${DJANGO_LOGIN_ACCOUNT_RATE:-10/min}
  DJANGO_USER_RATE: ${DJANGO_USER_RATE:-600/min}
  DJANGO_RESEARCH_SUBMISSION_RATE: ${DJANGO_RESEARCH_SUBMISSION_RATE:-120/hour}
  API_REQUEST_MAX_BYTES: ${API_REQUEST_MAX_BYTES:-1048576}
  SOURCE_SCHEDULED_PREVIEWS_ENABLED: ${SOURCE_SCHEDULED_PREVIEWS_ENABLED:-false}
  S3_STORAGE_ENABLED: "true"
  S3_BUCKET_NAME: ${S3_BUCKET_NAME:?Set S3_BUCKET_NAME in .env.production}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?Set S3_ENDPOINT_URL in .env.production}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env.production}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env.production}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
  R_VIZ_BASE_URL: http://r-viz:8001
  R_VIZ_API_TOKEN: ${R_VIZ_API_TOKEN:?Set R_VIZ_API_TOKEN in .env.production}
  DATASET_UPLOAD_MAX_BYTES: ${DATASET_UPLOAD_MAX_BYTES:-104857600}
  DATASET_STORAGE_QUOTA_BYTES: ${DATASET_STORAGE_QUOTA_BYTES:-1073741824}
  DATASET_COUNT_QUOTA: ${DATASET_COUNT_QUOTA:-100}
  STRING_DB_VERSION: ${STRING_DB_VERSION:-}
  CASE_MODEL_BASE_URL: ${CASE_MODEL_BASE_URL:-}
  CASE_MODEL_NAME: ${CASE_MODEL_NAME:-}
  CASE_MODEL_VERSION: ${CASE_MODEL_VERSION:-未配置}
  CASE_MODEL_API_KEY: ${CASE_MODEL_API_KEY:-}
  CASE_MODEL_TIMEOUT_SECONDS: ${CASE_MODEL_TIMEOUT_SECONDS:-180}
  CASE_ANALYSIS_MAX_INPUT_CHARS: ${CASE_ANALYSIS_MAX_INPUT_CHARS:-20000}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tcm_platform
      POSTGRES_USER: tcm_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcm_platform -d tcm_platform"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env.production}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [data]

  r-viz:
    build:
      context: ../r_viz
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      R_VIZ_API_TOKEN: ${R_VIZ_API_TOKEN:?Set R_VIZ_API_TOKEN in .env.production}
      PORT: "8001"
    expose: ["8001"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [visualization]

  setup:
    build: *python-build
    command: ["sh", "-c", "python manage.py check --deploy --fail-level WARNING && python manage.py migrate --noinput && python manage.py migrate case_rag --database=case_rag --noinput && python manage.py collectstatic --noinput"]
    environment: *django-environment
    volumes:
      - django_static:/app/staticfiles
      - case_rag_data:/app/var/case-rag
      - runtime_logs:/app/var/runtime-logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [data]

  api:
    build: *python-build
    restart: unless-stopped
    command: ["gunicorn", "--config", "python:config.gunicorn", "config.wsgi:application"]
    environment:
      <<: *django-environment
      MEDIA_ROOT: /app/var/media
    volumes:
      - django_static:/app/staticfiles:ro
      - runtime_logs:/app/var/runtime-logs
      - case_rag_data:/app/var/case-rag
    expose: ["8020"]
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; request=urllib.request.Request('http://127.0.0.1:8020/api/v1/health/',headers={'Host':os.environ['DJANGO_ALLOWED_HOSTS'],'X-Forwarded-Proto':'https'}); urllib.request.urlopen(request,timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 45s
    networks: [edge, data, egress]

  worker:
    build: *python-build
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2", "--queues=celery,r_visualization"]
    environment:
      <<: *django-environment
      MEDIA_ROOT: /app/var/media
      EMAIL_HOST: ""
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      DEFAULT_FROM_EMAIL: ""
      ADMIN_NOTIFICATION_EMAILS: ""
    volumes:
      - case_rag_data:/app/var/case-rag
      - runtime_logs:/app/var/runtime-logs
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      r-viz:
        condition: service_healthy
    networks: [data, egress, visualization]
    extra_hosts:
      - "host.docker.internal:host-gateway"

  beat:
    profiles: [scheduler]
    build: *python-build
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/app/var/celery/beat"]
    environment:
      <<: *django-environment
    volumes:
      - celery_schedule:/app/var/celery
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [data]

  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - django_static:/srv/django-static:ro
      - ./certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks: [edge]

volumes:
  postgres_data:
  redis_data:
  django_static:
  celery_schedule:
  case_rag_data:
  runtime_logs:

networks:
  edge:
  data:
    internal: true
  egress:
  visualization:
    internal: true
