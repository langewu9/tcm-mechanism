server_tokens off;
map $upstream_http_x_request_id $platform_request_id {
    default $upstream_http_x_request_id;
    "" $request_id;
}
log_format platform_safe escape=json '{"time":"$time_iso8601","client_ip":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"request_id":"$platform_request_id"}';
limit_req_zone $binary_remote_addr zone=platform_api:10m rate=600r/m;
limit_req_zone $binary_remote_addr zone=researcher_registration:10m rate=5r/m;
map $request_method $login_limit_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $login_limit_key zone=researcher_login:10m rate=30r/m;
