proxy_pass http://api:8020;
limit_req zone=platform_api burst=60 nodelay;
proxy_http_version 1.1;
gzip off;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# The single public edge sets this value; client-supplied chains are untrusted.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Leave cleanup/error-delivery headroom after Gunicorn's default 120s deadline.
proxy_read_timeout 130s;
