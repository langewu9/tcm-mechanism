services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tcm_platform
      POSTGRES_USER: tcm_platform
      POSTGRES_PASSWORD: tcm_platform_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tcm_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcm_platform -d tcm_platform"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - tcm_platform_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  r-viz:
    build:
      context: ../r_viz
      dockerfile: Dockerfile
    environment:
      R_VIZ_API_TOKEN: local-only-unsafe-render-token
      PORT: "8001"
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - visualization

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["sh", "-c", "python manage.py migrate && python manage.py runserver 0.0.0.0:8020"]
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: local-only-unsafe-key-do-not-use-in-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,api
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      DATABASE_URL: postgresql://tcm_platform:tcm_platform_dev_only@postgres:5432/tcm_platform
      CELERY_BROKER_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      MEDIA_ROOT: /app/var/media
      SQLITE_SOURCE_ROOT: /app/var/source-databases
      STRING_DB_VERSION: ${STRING_DB_VERSION:-}
    ports:
      - "127.0.0.1:8020:8020"
    volumes:
      - tcm_platform_media:/app/var/media
      - ../var/source-databases:/app/var/source-databases:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO"]
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: local-only-unsafe-key-do-not-use-in-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,api
      DATABASE_URL: postgresql://tcm_platform:tcm_platform_dev_only@postgres:5432/tcm_platform
      CELERY_BROKER_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/var/media
      SQLITE_SOURCE_ROOT: /app/var/source-databases
      STRING_DB_VERSION: ${STRING_DB_VERSION:-}
      R_VIZ_BASE_URL: http://r-viz:8001
      R_VIZ_API_TOKEN: local-only-unsafe-render-token
      CASE_MODEL_BASE_URL: ${CASE_MODEL_BASE_URL:-}
      CASE_MODEL_NAME: ${CASE_MODEL_NAME:-}
      CASE_MODEL_VERSION: ${CASE_MODEL_VERSION:-未配置}
      CASE_MODEL_API_KEY: ${CASE_MODEL_API_KEY:-}
      CASE_MODEL_TIMEOUT_SECONDS: ${CASE_MODEL_TIMEOUT_SECONDS:-180}
      CASE_ANALYSIS_MAX_INPUT_CHARS: ${CASE_ANALYSIS_MAX_INPUT_CHARS:-20000}
    volumes:
      - tcm_platform_media:/app/var/media
      - ../var/source-databases:/app/var/source-databases:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      r-viz:
        condition: service_healthy
    networks:
      - default
      - visualization
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  tcm_platform_pgdata:
  tcm_platform_redisdata:
  tcm_platform_media:

networks:
  visualization:
    internal: true
