services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tcm_platform
      POSTGRES_USER: tcm_platform
      POSTGRES_PASSWORD: tcm_platform_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tcm_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcm_platform -d tcm_platform"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - tcm_platform_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["sh", "-c", "python manage.py migrate && python manage.py runserver 0.0.0.0:8020"]
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: local-only-unsafe-key-do-not-use-in-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,api
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      DATABASE_URL: postgresql://tcm_platform:tcm_platform_dev_only@postgres:5432/tcm_platform
      CELERY_BROKER_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/var/media
      SQLITE_SOURCE_ROOT: /app/var/source-databases
    ports:
      - "127.0.0.1:8020:8020"
    volumes:
      - tcm_platform_media:/app/var/media
      - ../var/source-databases:/app/var/source-databases:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO"]
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_SECRET_KEY: local-only-unsafe-key-do-not-use-in-production
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,api
      DATABASE_URL: postgresql://tcm_platform:tcm_platform_dev_only@postgres:5432/tcm_platform
      CELERY_BROKER_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/var/media
      SQLITE_SOURCE_ROOT: /app/var/source-databases
    volumes:
      - tcm_platform_media:/app/var/media
      - ../var/source-databases:/app/var/source-databases:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  tcm_platform_pgdata:
  tcm_platform_redisdata:
  tcm_platform_media:
