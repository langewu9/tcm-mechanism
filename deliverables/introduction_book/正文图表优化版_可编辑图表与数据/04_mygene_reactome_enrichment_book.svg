  <path d="M34 34H866" stroke="#202020" stroke-width="1.8"/><path d="M34 44H866" stroke="#7f1d1d" stroke-width="1"/>
  <text class="title" x="44" y="76">MyGene—Reactome 通路补全</text><text class="subtitle" x="45" y="100">从候选靶点到人类基因符号、富集统计和官方目录的闭环补全</text>
  <g transform="translate(748 60)"><rect width="112" height="28" rx="14" fill="#34383c"/><text x="56" y="18" text-anchor="middle" font-size="10" fill="#fff">书刊正文版</text></g>
  
<g transform="translate(44 130)"><rect class="frame" width="812" height="986" rx="10"/>
<text class="section" x="24" y="31">平台受控域 · 候选与持久化</text>
<g transform="translate(24 54)"><rect class="accent" width="764" height="82" rx="8"/><text class="head" x="22" y="31">候选靶点集合</text><text class="small" x="22" y="53">来源：疾病—中药—成分—靶点网络 · 输入去重并限制 ≤ 500 labels</text><rect class="frame" x="614" y="23" width="124" height="36" rx="18"/><text class="mono" x="676" y="46" text-anchor="middle">≤ 500</text></g>
<path class="link" d="M406 136V162"/>
<g transform="translate(24 162)"><rect class="soft" width="764" height="98" rx="8"/><text class="head" x="22" y="31">输入规范化与查询契约</text><text class="small" x="22" y="52">去空 · 去重 · 精确短语 · scopes=symbol,alias,name · species=human</text><rect class="dark" x="22" y="67" width="720" height="22" rx="4"/><text x="382" y="82" text-anchor="middle" font-size="10" fill="#fff">MyGene POST · canonical symbols / Entrez ID</text></g>
<path class="dash" d="M406 260V288"/><text class="mono" x="420" y="278">HTTPS</text>
<text class="section" x="24" y="317">外部可信知识域 · MyGene.info</text>
<g transform="translate(24 338)"><rect class="soft" width="764" height="132" rx="8"/><rect class="frame" x="22" y="24" width="226" height="82" rx="7"/><text class="head" x="135" y="53" text-anchor="middle">输入</text><text class="small" x="135" y="75" text-anchor="middle">protein label / alias</text><rect class="frame" x="269" y="24" width="226" height="82" rx="7"/><text class="head" x="382" y="53" text-anchor="middle">输出</text><text class="small" x="382" y="75" text-anchor="middle">symbol / name / Entrez</text><rect class="accent" x="516" y="24" width="226" height="82" rx="7"/><text class="head" x="629" y="53" text-anchor="middle">约束</text><text class="small" x="629" y="75" text-anchor="middle">Homo sapiens</text></g>
<path class="dash" d="M406 470V498"/>
<text class="section" x="24" y="527">平台受控域 · Gene 映射入库</text>
<g transform="translate(24 548)"><rect class="accent" width="764" height="86" rx="8"/><text class="head" x="22" y="31">Target ↔ Gene</text><text class="small" x="22" y="53">symbol · name · entrezGeneId · sourceUrl · lastSyncedAt</text><rect class="frame" x="612" y="24" width="126" height="34" rx="17"/><text class="mono" x="675" y="45" text-anchor="middle">unique symbol</text></g>
<path class="link" d="M406 634V660"/>
<text class="section" x="24" y="689">外部可信知识域 · Reactome AnalysisService</text>
<g transform="translate(24 710)"><rect class="soft" width="764" height="116" rx="8"/><text class="head" x="22" y="31">基因符号 → 通路统计</text><text class="small" x="22" y="53">pathways · token · found / total · pValue · FDR · sourceVersion</text><rect class="dark" x="22" y="73" width="720" height="25" rx="4"/><text x="382" y="90" text-anchor="middle" font-size="10" fill="#fff">identifiers/projection · pageSize=100</text></g>
<path class="link" d="M406 826V852"/>
<text class="section" x="24" y="881">质量门与结果服务</text>
<g transform="translate(24 902)"><rect class="dark" width="764" height="102" rx="8"/><text x="22" y="30" font-size="14" font-weight="700" fill="#fff">只保留可解释富集结果</text><text x="22" y="57" font-size="12" fill="#ddd">FDR ≤ 0.05 · matched entities ≥ 2 · PathwayEnrichmentRun 1 → N Item</text><text x="22" y="80" font-size="10" fill="#bbb">官方人类目录按 R-HSA-* 稳定 ID 同步，前端按 FDR 排序展示</text></g>
</g>
