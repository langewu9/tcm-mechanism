  <path d="M34 34H866" stroke="#202020" stroke-width="1.8"/><path d="M34 44H866" stroke="#7f1d1d" stroke-width="1"/>
  <text class="title" x="44" y="76">系统总体架构</text><text class="subtitle" x="45" y="100">以研究任务为主线，串联身份、应用、领域服务、知识数据与治理边界</text>
  <g transform="translate(748 60)"><rect width="112" height="28" rx="14" fill="#34383c"/><text x="56" y="18" text-anchor="middle" font-size="10" fill="#fff">书刊正文版</text></g>
  
<g transform="translate(44 130)"><rect class="frame" width="812" height="986" rx="10"/>
<text class="section" x="24" y="31">01 · 访问与身份</text>
<g transform="translate(24 52)"><rect class="soft" width="764" height="84" rx="8"/><circle cx="34" cy="42" r="20" fill="#f7eeee" stroke="#7f1d1d"/><path d="M26 42h16M34 34v16" stroke="#7f1d1d" stroke-width="2"/><text class="head" x="72" y="36">研究员 / 管理员</text><text class="small" x="72" y="58">HMAC 会话 · HttpOnly · SameSite=Lax · RBAC 路由隔离</text><rect class="accent" x="602" y="23" width="132" height="36" rx="5"/><text class="mono" x="668" y="46" text-anchor="middle">qh_session</text></g>
<path class="link" d="M406 136V162"/>
<text class="section" x="24" y="190">02 · 应用交付</text>
<g transform="translate(24 210)"><rect class="accent" width="764" height="150" rx="8"/><text class="head" x="22" y="29">Next.js 15 全栈应用</text><text class="small" x="22" y="49">Server Components · Route Handlers · React 19</text><g transform="translate(22 70)"><rect class="frame" width="222" height="54" rx="5"/><text class="body" x="111" y="24" text-anchor="middle">检索与可视化</text><text class="small" x="111" y="42" text-anchor="middle">疾病 / 中药 / 成分 / 靶点</text></g><g transform="translate(271 70)"><rect class="frame" width="222" height="54" rx="5"/><text class="body" x="111" y="24" text-anchor="middle">数据与任务</text><text class="small" x="111" y="42" text-anchor="middle">数据集 / 病案 / 分析 / 导出</text></g><g transform="translate(520 70)"><rect class="frame" width="200" height="54" rx="5"/><text class="body" x="100" y="24" text-anchor="middle">智能助手</text><text class="small" x="100" y="42" text-anchor="middle">规则 / RAG / Qwen</text></g></g>
<path class="link" d="M406 360V386"/>
<text class="section" x="24" y="414">03 · 领域能力</text>
<g transform="translate(24 434)"><rect class="soft" width="764" height="236" rx="8"/><g transform="translate(22 20)"><rect class="frame" width="347" height="82" rx="6"/><text class="head" x="18" y="28">药理检索服务</text><text class="small" x="18" y="51">疾病—中药—成分—靶点联合查询</text><text class="mono" x="18" y="70">/api/research · /api/network-pharmacology</text></g><g transform="translate(395 20)"><rect class="frame" width="347" height="82" rx="6"/><text class="head" x="18" y="28">网络分析与交付</text><text class="small" x="18" y="51">证据交集 · 图谱 · CSV / PDF / JSON</text><text class="mono" x="18" y="70">AnalysisTask → AnalysisResult</text></g><g transform="translate(22 122)"><rect class="frame" width="347" height="82" rx="6"/><text class="head" x="18" y="28">动态数据库同步</text><text class="small" x="18" y="51">映射 · 批次 · 游标 · 运行审计</text><text class="mono" x="18" y="70">DatabaseSource → SyncRun</text></g><g transform="translate(395 122)"><rect class="frame" width="347" height="82" rx="6"/><text class="head" x="18" y="28">通路富集服务</text><text class="small" x="18" y="51">MyGene 规范化 → Reactome FDR</text><text class="mono" x="18" y="70">/api/pathway-enrichment</text></g></g>
<path class="link" d="M406 670V696"/>
<text class="section" x="24" y="724">04 · 数据与知识</text>
<g transform="translate(24 744)"><rect class="dark" width="764" height="128" rx="8"/><g transform="translate(20 20)"><text x="0" y="18" font-size="14" font-weight="700" fill="#fff">本地强一致数据</text><text x="0" y="42" font-size="11" fill="#ddd">Prisma / SQLite：用户、病案、任务、实体、通路、运行记录</text></g><path d="M382 18V104" stroke="#777"/><g transform="translate(414 20)"><text x="0" y="18" font-size="14" font-weight="700" fill="#fff">外部可信知识</text><text x="0" y="42" font-size="11" fill="#ddd">ChEMBL 本地库 · MyGene · Reactome · Qwen（可选）</text></g></g>
<text class="section" x="24" y="914">05 · 横切治理</text><g transform="translate(24 936)"><rect class="frame" width="764" height="102" rx="8"/><path d="M190 20V82M380 20V82M570 20V82" stroke="#e1e1df"/><text class="body" x="95" y="43" text-anchor="middle">身份权限</text><text class="small" x="95" y="63" text-anchor="middle">RBAC / 密码哈希</text><text class="body" x="285" y="43" text-anchor="middle">输入防护</text><text class="small" x="285" y="63" text-anchor="middle">限量 / 超时 / 白名单</text><text class="body" x="475" y="43" text-anchor="middle">可追溯性</text><text class="small" x="475" y="63" text-anchor="middle">来源版本 / 稳定 ID</text><text class="body" x="665" y="43" text-anchor="middle">可恢复性</text><text class="small" x="665" y="63" text-anchor="middle">事务 / 游标 / 降级</text></g>
</g>
