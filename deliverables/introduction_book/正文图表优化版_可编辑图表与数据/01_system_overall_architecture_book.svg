<filter id="shadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity=".10"/></filter>
<style>
text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif}
.title{font-size:27px;font-weight:700;letter-spacing:.6px;fill:#202020}.subtitle{font-size:12px;fill:#686868}
.section{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#7f1d1d}.head{font-size:16px;font-weight:700;fill:#202020}.body{font-size:12px;fill:#202020}.small{font-size:10px;fill:#686868}.mono{font-family:Consolas,'Microsoft YaHei',monospace;font-size:10px;fill:#4d4d4d}
