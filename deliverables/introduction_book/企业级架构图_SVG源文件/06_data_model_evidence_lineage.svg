<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker>
    <marker id="arrThin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".09"/></filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#ececec" stroke-width=".6"/></pattern>
    <style>
      text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif}
      .t{font-size:31px;font-weight:700;letter-spacing:1px;fill:#202020}.st{font-size:15px;fill:#656565}
      .zone{font-size:13px;font-weight:700;letter-spacing:2px;fill:#7f1d1d}
      .h{font-size:17px;font-weight:700;fill:#202020}.b{font-size:13px;fill:#202020}.s{font-size:11px;fill:#656565}
      .mono{font-family:Consolas,'Microsoft YaHei',monospace;font-size:11px;fill:#4b4b4b}
      .panel{fill:#ffffff;stroke:#a8a8a8;stroke-width:1.2}.soft{fill:#f7f7f5;stroke:#c7c7c7;stroke-width:1}
      .accent{fill:#f7eeee;stroke:#7f1d1d;stroke-width:1.4}.dark{fill:#34383c;stroke:#34383c;stroke-width:1.2}
      .link{fill:none;stroke:#696969;stroke-width:1.5;marker-end:url(#arr)}.dash{fill:none;stroke:#858585;stroke-width:1.25;stroke-dasharray:7 5;marker-end:url(#arrThin)}
      .bus{fill:none;stroke:#7f1d1d;stroke-width:2}.hair{fill:none;stroke:#b0b0b0;stroke-width:1}
    </style>
  </defs>
  <rect width="1600" height="980" fill="#ffffff"/>
  <path d="M44 44H1556" stroke="#202020" stroke-width="2"/><path d="M44 55H1556" stroke="#7f1d1d" stroke-width="1"/>
  <text class="t" x="58" y="101">核心数据模型与证据血缘</text><text class="st" x="60" y="132">以用户研究任务为主线连接业务资产、药理实体、外部标识与富集统计，支持结果回溯和重复验证</text>
  <g transform="translate(1440 72)"><rect width="104" height="36" rx="18" fill="#34383c"/><text x="52" y="23" text-anchor="middle" font-size="12" fill="#fff">架构蓝图</text></g>
  
<g transform="translate(60 170)">
  <rect class="soft" width="1480" height="730" rx="16" fill="url(#grid)"/>
  <g transform="translate(28 28)"><rect class="panel" width="1424" height="654" rx="10"/><text class="zone" x="24" y="32">业务对象域</text>
    <g transform="translate(28 64)"><rect class="accent" width="210" height="100" rx="8"/><text class="h" x="105" y="30" text-anchor="middle">User</text><text class="s" x="105" y="52" text-anchor="middle">研究员 / 管理员</text><path d="M20 66H190" stroke="#7f1d1d"/><text class="mono" x="105" y="84" text-anchor="middle">ownerId · role</text></g>
    <path class="link" d="M238 114H292"/><g transform="translate(292 64)"><rect class="soft" width="210" height="100" rx="8"/><text class="h" x="105" y="30" text-anchor="middle">MedicalCase</text><text class="s" x="105" y="52" text-anchor="middle">症状 · 舌脉 · 诊断</text><path d="M20 66H190" stroke="#ccc"/><text class="mono" x="105" y="84" text-anchor="middle">caseId</text></g>
    <path class="link" d="M502 114H556"/><g transform="translate(556 64)"><rect class="accent" width="232" height="100" rx="8"/><text class="h" x="116" y="30" text-anchor="middle">AnalysisTask</text><text class="s" x="116" y="52" text-anchor="middle">query · status · timestamps</text><path d="M20 66H212" stroke="#7f1d1d"/><text class="mono" x="116" y="84" text-anchor="middle">taskId · ownerId</text></g>
    <path class="link" d="M788 114H842"/><g transform="translate(842 64)"><rect class="soft" width="232" height="100" rx="8"/><text class="h" x="116" y="30" text-anchor="middle">AnalysisResult</text><text class="s" x="116" y="52" text-anchor="middle">summary · evidence · network</text><path d="M20 66H212" stroke="#ccc"/><text class="mono" x="116" y="84" text-anchor="middle">1 : 1 taskId</text></g>
    <path class="link" d="M1074 114H1128"/><g transform="translate(1128 64)"><rect class="soft" width="240" height="100" rx="8"/><text class="h" x="120" y="30" text-anchor="middle">CSV / PDF / JSON</text><text class="s" x="120" y="52" text-anchor="middle">可下载研究交付物</text><path d="M20 66H220" stroke="#ccc"/><text class="mono" x="120" y="84" text-anchor="middle">derived artifact</text></g>

    <text class="zone" x="24" y="216">药理知识域</text><path d="M40 246H1360" stroke="#ddd"/>
    <g transform="translate(44 282)"><rect class="soft" width="190" height="92" rx="46"/><text class="h" x="95" y="38" text-anchor="middle">Formula</text><text class="s" x="95" y="61" text-anchor="middle">方剂</text></g>
    <path class="link" d="M234 328H292"/><text class="mono" x="244" y="315">M:N</text><g transform="translate(292 282)"><rect class="accent" width="190" height="92" rx="46"/><text class="h" x="95" y="38" text-anchor="middle">Herb</text><text class="s" x="95" y="61" text-anchor="middle">中药实体 · name unique</text></g>
    <path class="link" d="M482 328H540"/><text class="mono" x="492" y="315">M:N</text><g transform="translate(540 282)"><rect class="soft" width="190" height="92" rx="46"/><text class="h" x="95" y="38" text-anchor="middle">Compound</text><text class="s" x="95" y="61" text-anchor="middle">活性成分 · name unique</text></g>
    <path class="link" d="M730 328H788"/><text class="mono" x="740" y="315">M:N</text><g transform="translate(788 282)"><rect class="accent" width="190" height="92" rx="46"/><text class="h" x="95" y="38" text-anchor="middle">Target</text><text class="s" x="95" y="61" text-anchor="middle">作用靶点 · symbol unique</text></g>
    <path class="link" d="M978 328H1036"/><text class="mono" x="988" y="315">M:N</text><g transform="translate(1036 282)"><rect class="soft" width="190" height="92" rx="46"/><text class="h" x="95" y="38" text-anchor="middle">Pathway</text><text class="s" x="95" y="61" text-anchor="middle">Reactome stable ID</text></g>
    <path class="link" d="M978 350C1002 398 1030 420 1090 420"/><g transform="translate(1122 398)"><rect class="soft" width="246" height="72" rx="8"/><text class="h" x="123" y="28" text-anchor="middle">Gene</text><text class="s" x="123" y="50" text-anchor="middle">MyGene symbol · Entrez ID</text></g>

    <g transform="translate(44 430)"><rect class="panel" width="934" height="172" rx="10"/><text class="zone" x="22" y="29">同步与来源血缘</text>
      <g transform="translate(22 54)"><rect class="soft" width="205" height="86" rx="6"/><text class="b" x="102" y="25" text-anchor="middle">DatabaseSource</text><text class="s" x="102" y="46" text-anchor="middle">driver · mapping · cursor</text><text class="mono" x="102" y="67" text-anchor="middle">lastSyncedAt</text></g>
      <path class="link" d="M245 97H297"/><g transform="translate(297 54)"><rect class="accent" width="220" height="86" rx="6"/><text class="b" x="110" y="25" text-anchor="middle">DatabaseSyncRun</text><text class="s" x="110" y="46" text-anchor="middle">rowsRead · entity counts</text><text class="mono" x="110" y="67" text-anchor="middle">status · errorMessage</text></g>
      <path class="link" d="M535 97H587"/><g transform="translate(587 54)"><rect class="soft" width="320" height="86" rx="6"/><text class="b" x="160" y="25" text-anchor="middle">来源属性</text><text class="s" x="160" y="46" text-anchor="middle">source · externalId · sourceUrl</text><text class="mono" x="160" y="67" text-anchor="middle">sourceVersion · lastSyncedAt</text></g>
    </g>
    <g transform="translate(1006 494)"><rect class="dark" width="362" height="108" rx="10"/><text x="20" y="27" font-size="13" font-weight="700" fill="#fff">查询级统计证据</text><text x="20" y="51" font-size="11" fill="#ddd">PathwayEnrichmentRun 1 → N Item</text><text x="20" y="73" font-size="11" fill="#ddd">rank · matched · total · coverage</text><text x="20" y="94" font-size="11" fill="#ddd">pValue · FDR · Reactome token</text></g>
    <path class="dash" d="M904 164V230C904 250 1128 250 1128 282"/><text class="mono" x="932" y="220">evidenceJson / networkJson</text>
  </g>
</g>
  <g transform="translate(60 938)"><circle cx="5" cy="-5" r="5" fill="#7f1d1d"/><text class="s" x="18" y="0">受控接口 / 强一致写入</text><path d="M220 -5h45" stroke="#6e6e6e" stroke-width="1.5" marker-end="url(#arrThin)"/><text class="s" x="278" y="0">数据或调用方向</text><path d="M455 -5h45" stroke="#858585" stroke-dasharray="6 4"/><text class="s" x="513" y="0">异步 / 外部依赖</text></g>
  <text class="s" x="1540" y="938" text-anchor="end">中医药理智能分析平台 · 技术架构文档</text>
  </svg>