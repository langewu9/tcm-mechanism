<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker>
    <marker id="arrThin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".09"/></filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#ececec" stroke-width=".6"/></pattern>
    <style>
      text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif}
      .t{font-size:31px;font-weight:700;letter-spacing:1px;fill:#202020}.st{font-size:15px;fill:#656565}
      .zone{font-size:13px;font-weight:700;letter-spacing:2px;fill:#7f1d1d}
      .h{font-size:17px;font-weight:700;fill:#202020}.b{font-size:13px;fill:#202020}.s{font-size:11px;fill:#656565}
      .mono{font-family:Consolas,'Microsoft YaHei',monospace;font-size:11px;fill:#4b4b4b}
      .panel{fill:#ffffff;stroke:#a8a8a8;stroke-width:1.2}.soft{fill:#f7f7f5;stroke:#c7c7c7;stroke-width:1}
      .accent{fill:#f7eeee;stroke:#7f1d1d;stroke-width:1.4}.dark{fill:#34383c;stroke:#34383c;stroke-width:1.2}
      .link{fill:none;stroke:#696969;stroke-width:1.5;marker-end:url(#arr)}.dash{fill:none;stroke:#858585;stroke-width:1.25;stroke-dasharray:7 5;marker-end:url(#arrThin)}
      .bus{fill:none;stroke:#7f1d1d;stroke-width:2}.hair{fill:none;stroke:#b0b0b0;stroke-width:1}
    </style>
  </defs>
  <rect width="1600" height="960" fill="#ffffff"/>
  <path d="M44 44H1556" stroke="#202020" stroke-width="2"/><path d="M44 55H1556" stroke="#7f1d1d" stroke-width="1"/>
  <text class="t" x="58" y="101">系统总体架构</text><text class="st" x="60" y="132">面向中医药理证据检索、网络分析与可追溯研究交付的一体化全栈平台</text>
  <g transform="translate(1440 72)"><rect width="104" height="36" rx="18" fill="#34383c"/><text x="52" y="23" text-anchor="middle" font-size="12" fill="#fff">架构蓝图</text></g>
  
<g transform="translate(60 170)">
  <rect class="soft" x="0" y="0" width="1480" height="700" rx="16" fill="url(#grid)"/>
  <text class="zone" x="28" y="34">01 · 访问与身份域</text>
  <g filter="url(#shadow)"><rect class="panel" x="28" y="58" width="208" height="210" rx="10"/></g>
  <text class="h" x="52" y="91">研究用户与管理角色</text>
  <circle cx="76" cy="128" r="18" fill="#f7eeee" stroke="#7f1d1d"/><path d="M68 129h16M76 121v16" stroke="#7f1d1d" stroke-width="2"/>
  <text class="b" x="106" y="133">研究员 RESEARCHER</text>
  <circle cx="76" cy="178" r="18" fill="#eee" stroke="#555"/><path d="M67 178h18M76 169v18" stroke="#555" stroke-width="2"/>
  <text class="b" x="106" y="183">管理员 ADMIN</text>
  <rect class="accent" x="52" y="215" width="160" height="33" rx="5"/><text class="mono" x="132" y="236" text-anchor="middle">qh_session · HMAC</text>

  <text class="zone" x="278" y="34">02 · 应用交付域</text>
  <g filter="url(#shadow)"><rect class="panel" x="276" y="58" width="326" height="295" rx="10"/></g>
  <text class="h" x="300" y="91">Next.js 15 全栈应用</text><text class="s" x="300" y="114">React 19 · Server Components · Route Handlers</text>
  <g><rect class="soft" x="300" y="137" width="132" height="65" rx="6"/><text class="b" x="366" y="162" text-anchor="middle">业务工作台</text><text class="s" x="366" y="183" text-anchor="middle">检索 / 可视化 / 病案</text></g>
  <g><rect class="soft" x="446" y="137" width="132" height="65" rx="6"/><text class="b" x="512" y="162" text-anchor="middle">分析与导出</text><text class="s" x="512" y="183" text-anchor="middle">网络 / CSV / PDF</text></g>
  <g><rect class="soft" x="300" y="218" width="132" height="65" rx="6"/><text class="b" x="366" y="243" text-anchor="middle">数据治理</text><text class="s" x="366" y="264" text-anchor="middle">数据集 / 动态同步</text></g>
  <g><rect class="soft" x="446" y="218" width="132" height="65" rx="6"/><text class="b" x="512" y="243" text-anchor="middle">智能助手</text><text class="s" x="512" y="264" text-anchor="middle">规则 / RAG / Qwen</text></g>
  <rect class="dark" x="300" y="302" width="278" height="32" rx="5"/><text x="439" y="323" text-anchor="middle" font-size="12" fill="#fff">/api/* · 统一鉴权、校验与错误边界</text>

  <text class="zone" x="644" y="34">03 · 领域服务与证据计算域</text>
  <g filter="url(#shadow)"><rect class="panel" x="642" y="58" width="488" height="410" rx="10"/></g>
  <text class="h" x="666" y="91">可组合领域能力</text>
  <g><rect class="accent" x="666" y="119" width="205" height="70" rx="6"/><text class="b" x="685" y="145">药理检索服务</text><text class="s" x="685" y="167">疾病 · 中药 · 成分 · 靶点</text></g>
  <g><rect class="soft" x="895" y="119" width="211" height="70" rx="6"/><text class="b" x="914" y="145">网络药理分析引擎</text><text class="s" x="914" y="167">交集 · 证据链 · 图谱构建</text></g>
  <g><rect class="soft" x="666" y="207" width="205" height="70" rx="6"/><text class="b" x="685" y="233">通路富集服务</text><text class="s" x="685" y="255">MyGene → Reactome → FDR</text></g>
  <g><rect class="soft" x="895" y="207" width="211" height="70" rx="6"/><text class="b" x="914" y="233">分析任务与交付</text><text class="s" x="914" y="255">持久化 · CSV · PDF · JSON</text></g>
  <g><rect class="soft" x="666" y="295" width="205" height="70" rx="6"/><text class="b" x="685" y="321">动态数据库同步</text><text class="s" x="685" y="343">映射 · 批次 · 游标 · 审计</text></g>
  <g><rect class="soft" x="895" y="295" width="211" height="70" rx="6"/><text class="b" x="914" y="321">FastAPI 数据服务</text><text class="s" x="914" y="343">本地数据 · ChEMBL · Scientist</text></g>
  <rect class="dark" x="666" y="386" width="440" height="54" rx="6"/><text x="686" y="408" font-size="12" fill="#fff">服务编排总线</text><text x="686" y="427" font-size="11" fill="#ddd">HTTP/JSON · Prisma Client · node:sqlite · 超时与降级</text>

  <text class="zone" x="1174" y="34">04 · 数据与外部知识域</text>
  <g filter="url(#shadow)"><rect class="panel" x="1172" y="58" width="280" height="410" rx="10"/></g>
  <g><rect class="accent" x="1196" y="91" width="232" height="58" rx="6"/><text class="b" x="1216" y="115">Prisma 业务数据库</text><text class="s" x="1216" y="136">用户 / 病案 / 任务 / 通路 / 审计</text></g>
  <g><rect class="soft" x="1196" y="164" width="232" height="58" rx="6"/><text class="b" x="1216" y="188">动态 SQLite 数据源</text><text class="s" x="1216" y="209">herb_component_target · 只读</text></g>
  <g><rect class="soft" x="1196" y="237" width="232" height="58" rx="6"/><text class="b" x="1216" y="261">ChEMBL 36 本地库</text><text class="s" x="1216" y="282">分子 / 结构 / 活性证据</text></g>
  <g><rect class="soft" x="1196" y="310" width="232" height="58" rx="6"/><text class="b" x="1216" y="334">MyGene + Reactome</text><text class="s" x="1216" y="355">基因规范化 / 人类通路</text></g>
  <g><rect class="soft" x="1196" y="383" width="232" height="58" rx="6"/><text class="b" x="1216" y="407">Qwen（可选）</text><text class="s" x="1216" y="428">云端推理 · 密钥按环境注入</text></g>

  <path class="link" d="M236 162H276"/><text class="mono" x="242" y="150">HTTPS</text>
  <path class="link" d="M602 206H642"/><text class="mono" x="607" y="194">JSON</text>
  <path class="link" d="M1130 264H1172"/><text class="mono" x="1134" y="252">SQL/API</text>
  <path class="dash" d="M1130 337C1150 337 1150 339 1172 339"/>

  <g transform="translate(276 506)"><rect class="panel" width="1176" height="140" rx="10"/><text class="zone" x="24" y="30">05 · 横切治理平面</text>
    <path d="M26 52H1148" stroke="#c4c4c4"/>
    <g transform="translate(26 70)"><circle cx="12" cy="12" r="11" fill="#7f1d1d"/><text class="b" x="32" y="17">身份与权限</text><text class="s" x="32" y="39">RBAC · 管理路由隔离</text></g>
    <g transform="translate(306 70)"><circle cx="12" cy="12" r="11" fill="#555"/><text class="b" x="32" y="17">输入与接口防护</text><text class="s" x="32" y="39">字段白名单 · 超时 · 限量</text></g>
    <g transform="translate(610 70)"><circle cx="12" cy="12" r="11" fill="#555"/><text class="b" x="32" y="17">可追溯性</text><text class="s" x="32" y="39">来源版本 · 稳定 ID · 运行记录</text></g>
    <g transform="translate(870 70)"><circle cx="12" cy="12" r="11" fill="#555"/><text class="b" x="32" y="17">运行可靠性</text><text class="s" x="32" y="39">事务 · 断点续传 · 失败降级</text></g>
  </g>
</g>
  <g transform="translate(60 918)"><circle cx="5" cy="-5" r="5" fill="#7f1d1d"/><text class="s" x="18" y="0">受控接口 / 强一致写入</text><path d="M220 -5h45" stroke="#6e6e6e" stroke-width="1.5" marker-end="url(#arrThin)"/><text class="s" x="278" y="0">数据或调用方向</text><path d="M455 -5h45" stroke="#858585" stroke-dasharray="6 4"/><text class="s" x="513" y="0">异步 / 外部依赖</text></g>
  <text class="s" x="1540" y="918" text-anchor="end">中医药理智能分析平台 · 技术架构文档</text>
