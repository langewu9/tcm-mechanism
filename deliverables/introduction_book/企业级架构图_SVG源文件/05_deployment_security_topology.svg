<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker>
    <marker id="arrThin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="context-stroke" stroke-width="1.2"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".09"/></filter>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#ececec" stroke-width=".6"/></pattern>
    <style>
      text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif}
      .t{font-size:31px;font-weight:700;letter-spacing:1px;fill:#202020}.st{font-size:15px;fill:#656565}
      .zone{font-size:13px;font-weight:700;letter-spacing:2px;fill:#7f1d1d}
      .h{font-size:17px;font-weight:700;fill:#202020}.b{font-size:13px;fill:#202020}.s{font-size:11px;fill:#656565}
      .mono{font-family:Consolas,'Microsoft YaHei',monospace;font-size:11px;fill:#4b4b4b}
      .panel{fill:#ffffff;stroke:#a8a8a8;stroke-width:1.2}.soft{fill:#f7f7f5;stroke:#c7c7c7;stroke-width:1}
      .accent{fill:#f7eeee;stroke:#7f1d1d;stroke-width:1.4}.dark{fill:#34383c;stroke:#34383c;stroke-width:1.2}
      .link{fill:none;stroke:#696969;stroke-width:1.5;marker-end:url(#arr)}.dash{fill:none;stroke:#858585;stroke-width:1.25;stroke-dasharray:7 5;marker-end:url(#arrThin)}
      .bus{fill:none;stroke:#7f1d1d;stroke-width:2}.hair{fill:none;stroke:#b0b0b0;stroke-width:1}
    </style>
  </defs>
  <rect width="1600" height="980" fill="#ffffff"/>
  <path d="M44 44H1556" stroke="#202020" stroke-width="2"/><path d="M44 55H1556" stroke="#7f1d1d" stroke-width="1"/>
  <text class="t" x="58" y="101">部署拓扑与安全边界</text><text class="st" x="60" y="132">单机研究环境下的双服务运行时、数据驻留、外部出口控制与分层权限保护</text>
  <g transform="translate(1440 72)"><rect width="104" height="36" rx="18" fill="#34383c"/><text x="52" y="23" text-anchor="middle" font-size="12" fill="#fff">架构蓝图</text></g>
  
<g transform="translate(60 170)">
  <rect class="soft" width="1480" height="730" rx="16" fill="url(#grid)"/>
  <g transform="translate(28 28)"><rect class="panel" width="1424" height="654" rx="10"/><text class="zone" x="24" y="32">运行拓扑 · Windows 本地研究工作站</text>
    <g transform="translate(30 66)"><rect class="soft" width="248" height="214" rx="10"/><text class="h" x="124" y="30" text-anchor="middle">客户端信任区</text><text class="s" x="124" y="52" text-anchor="middle">Browser / In-app Browser</text>
      <g transform="translate(38 78)"><rect x="0" y="0" width="172" height="98" rx="6" fill="#fff" stroke="#555" stroke-width="1.5"/><path d="M0 23H172" stroke="#999"/><circle cx="14" cy="12" r="3" fill="#7f1d1d"/><circle cx="26" cy="12" r="3" fill="#777"/><path d="M52 98v16M25 114h102" stroke="#555" stroke-width="2"/></g>
      <text class="mono" x="124" y="200" text-anchor="middle">http://127.0.0.1:3000</text>
    </g>
    <path class="link" d="M296 173H360"/><text class="mono" x="310" y="160">HTTP</text>
    <g transform="translate(360 66)"><rect class="accent" width="400" height="350" rx="10"/><text class="h" x="200" y="31" text-anchor="middle">应用服务区 · Node.js</text><text class="s" x="200" y="53" text-anchor="middle">Next.js production runtime · port 3000</text>
      <g transform="translate(28 81)"><rect class="panel" width="344" height="66" rx="6"/><text class="b" x="18" y="25">页面与 Server Components</text><text class="s" x="18" y="47">登录 · 工作台 · 检索 · 可视化 · 管理</text></g>
      <g transform="translate(28 163)"><rect class="panel" width="344" height="66" rx="6"/><text class="b" x="18" y="25">Route Handlers /api/*</text><text class="s" x="18" y="47">鉴权 · 参数校验 · 业务编排 · 导出</text></g>
      <g transform="translate(28 245)"><rect class="dark" width="344" height="70" rx="6"/><text x="18" y="26" font-size="12" font-weight="700" fill="#fff">安全控制</text><text x="18" y="48" font-size="10" fill="#ddd">HMAC session · HttpOnly · SameSite=Lax · RBAC</text></g>
    </g>
    <path class="link" d="M778 173H842"/><text class="mono" x="789" y="160">JSON</text>
    <g transform="translate(842 66)"><rect class="soft" width="310" height="350" rx="10"/><text class="h" x="155" y="31" text-anchor="middle">数据服务区 · Python</text><text class="s" x="155" y="53" text-anchor="middle">FastAPI · port 8010</text>
      <g transform="translate(26 81)"><rect class="panel" width="258" height="56" rx="6"/><text class="b" x="129" y="22" text-anchor="middle">本地药理检索 API</text><text class="s" x="129" y="42" text-anchor="middle">disease / herb / component</text></g>
      <g transform="translate(26 153)"><rect class="panel" width="258" height="56" rx="6"/><text class="b" x="129" y="22" text-anchor="middle">ChEMBL 分子活性 API</text><text class="s" x="129" y="42" text-anchor="middle">molecules / activities</text></g>
      <g transform="translate(26 225)"><rect class="panel" width="258" height="56" rx="6"/><text class="b" x="129" y="22" text-anchor="middle">AI Scientist / Qwen 适配</text><text class="s" x="129" y="42" text-anchor="middle">可选增强与本地降级</text></g>
      <rect class="dark" x="26" y="297" width="258" height="28" rx="5"/><text x="155" y="316" text-anchor="middle" font-size="10" fill="#fff">仅回环地址 · 不直接暴露公网</text>
    </g>
    <path class="dash" d="M1170 173H1222"/><text class="mono" x="1175" y="160">HTTPS</text>
    <g transform="translate(1222 66)"><rect x="0" y="0" width="172" height="350" rx="10" fill="#f3f3f1" stroke="#777" stroke-dasharray="8 5"/><text class="h" x="86" y="31" text-anchor="middle">互联网服务区</text><text class="s" x="86" y="53" text-anchor="middle">受控出站</text>
      <g transform="translate(18 84)"><rect class="panel" width="136" height="56" rx="6"/><text class="b" x="68" y="23" text-anchor="middle">MyGene</text><text class="s" x="68" y="42" text-anchor="middle">基因标准化</text></g>
      <g transform="translate(18 157)"><rect class="panel" width="136" height="56" rx="6"/><text class="b" x="68" y="23" text-anchor="middle">Reactome</text><text class="s" x="68" y="42" text-anchor="middle">目录与富集</text></g>
      <g transform="translate(18 230)"><rect class="panel" width="136" height="56" rx="6"/><text class="b" x="68" y="23" text-anchor="middle">Qwen API</text><text class="s" x="68" y="42" text-anchor="middle">可选云推理</text></g>
      <text class="s" x="86" y="320" text-anchor="middle">超时 / 状态检测</text><text class="s" x="86" y="339" text-anchor="middle">失败不阻断本地主链</text>
    </g>

    <g transform="translate(30 444)"><rect class="panel" width="760" height="166" rx="10"/><text class="zone" x="22" y="29">本地数据驻留区</text>
      <g transform="translate(22 52)"><rect class="accent" width="210" height="83" rx="6"/><text class="b" x="105" y="24" text-anchor="middle">Prisma 业务库</text><text class="s" x="105" y="45" text-anchor="middle">用户 · 任务 · 病案 · 通路</text><text class="mono" x="105" y="65" text-anchor="middle">read / write</text></g>
      <g transform="translate(253 52)"><rect class="soft" width="220" height="83" rx="6"/><text class="b" x="110" y="24" text-anchor="middle">药理缓存与外部源库</text><text class="s" x="110" y="45" text-anchor="middle">SQLite · 表级字段映射</text><text class="mono" x="110" y="65" text-anchor="middle">source read only</text></g>
      <g transform="translate(494 52)"><rect class="soft" width="244" height="83" rx="6"/><text class="b" x="122" y="24" text-anchor="middle">ChEMBL 36 / 文件资产</text><text class="s" x="122" y="45" text-anchor="middle">分子数据 · 上传数据集 · 导出物</text><text class="mono" x="122" y="65" text-anchor="middle">local filesystem</text></g>
    </g>
    <path class="link" d="M560 416V444"/><path class="link" d="M997 416V492H790"/>

    <g transform="translate(818 444)"><rect class="panel" width="576" height="166" rx="10"/><text class="zone" x="22" y="29">纵深防御与运行保障</text>
      <g transform="translate(22 55)"><circle cx="14" cy="14" r="13" fill="#7f1d1d"/><text class="b" x="39" y="18">身份</text><text class="s" x="39" y="39">密码哈希 · 会话签名</text></g>
      <g transform="translate(204 55)"><circle cx="14" cy="14" r="13" fill="#555"/><text class="b" x="39" y="18">授权</text><text class="s" x="39" y="39">研究员 / 管理员隔离</text></g>
      <g transform="translate(397 55)"><circle cx="14" cy="14" r="13" fill="#555"/><text class="b" x="39" y="18">密钥</text><text class="s" x="39" y="39">环境变量注入</text></g>
      <g transform="translate(22 111)"><circle cx="14" cy="14" r="13" fill="#555"/><text class="b" x="39" y="18">数据</text><text class="s" x="39" y="39">源库只读 · 事务写入</text></g>
      <g transform="translate(204 111)"><circle cx="14" cy="14" r="13" fill="#555"/><text class="b" x="39" y="18">接口</text><text class="s" x="39" y="39">限量 · 超时 · 错误边界</text></g>
      <g transform="translate(397 111)"><circle cx="14" cy="14" r="13" fill="#555"/><text class="b" x="39" y="18">恢复</text><text class="s" x="39" y="39">游标 · 审计 · 降级</text></g>
    </g>
  </g>
</g>
  <g transform="translate(60 938)"><circle cx="5" cy="-5" r="5" fill="#7f1d1d"/><text class="s" x="18" y="0">受控接口 / 强一致写入</text><path d="M220 -5h45" stroke="#6e6e6e" stroke-width="1.5" marker-end="url(#arrThin)"/><text class="s" x="278" y="0">数据或调用方向</text><path d="M455 -5h45" stroke="#858585" stroke-dasharray="6 4"/><text class="s" x="513" y="0">异步 / 外部依赖</text></g>
  <text class="s" x="1540" y="938" text-anchor="end">中医药理智能分析平台 · 技术架构文档</text>
