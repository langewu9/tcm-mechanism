      <g transform="translate(24 201)"><rect class="panel" width="202" height="48" rx="5"/><text class="b" x="101" y="21" text-anchor="middle">成分 → 分子 / 活性</text><text class="s" x="101" y="38" text-anchor="middle">ChEMBL 36</text></g>
      <g transform="translate(24 263)"><rect class="accent" width="202" height="64" rx="5"/><text class="b" x="101" y="23" text-anchor="middle">证据来源保留</text><text class="s" x="101" y="43" text-anchor="middle">source · query · sourceUrl</text></g>
